defaults:
  - _self_

encoder_name: spUnet

name: robot_${task_name}
_target_: act.workspace.robotworkspace.RobotWorkspace

task_name: null
exp_name: "default"

training:
  seed: 42
  num_epochs: 2000
  lr_scheduler: cosine
  lr_warmup_steps: 5000
  checkpoint_every: 1000
  output_dir: ""

dataset:
  dataset_dir: null
  num_episodes: 100
  camera_names:
    - head_camera
  batch_size_train: 2
  batch_size_val: 2
  state_dim: 9
  obs_keys:
    head_camera:
      shape: [3, 256, 256]
    state:
      shape:
        - ${dataset.state_dim}
    action:
      shape:
        - ${dataset.state_dim}
    head_camera_pnt_cloud:
      shape: [4096, 3]
  voxel_pnt_cloud: True
  pnt_dim: 6
  transform_pcd:
    - _target_: roboverse_learn.algorithms.utils.transformpcd.GridSamplePCD
      grid_size: 0.005
      hash_type: fnv
      mode: train
      return_grid_coord: true
      return_displacement: false
      keys:
        - coord
        - color
    - _target_: roboverse_learn.algorithms.utils.transformpcd.ShufflePointPCD
    - _target_: roboverse_learn.algorithms.utils.transformpcd.ToTensorPCD
    - _target_: roboverse_learn.algorithms.utils.transformpcd.CollectPCD
      keys:
        - coord
        - grid_coord
      feat_keys:
        - color
        - coord


policy:
  _target_: act.policy.ACTPolicy
  params:
    lr: 5e-5                # --lr
    weight_decay: 0.05     # --weight_decay
    state_dim: ${dataset.state_dim}         # --state_dim
    kl_weight: 10
    # backbone
    camera_names: ${dataset.camera_names}        # --camera_names
    lr_backbone: 5e-5  # --lr_backbone

    # transformer
    enc_layers: 4           # --enc_layers
    dec_layers: 7           # --dec_layers
    dim_feedforward: 32   # --dim_feedforward
    hidden_dim: 512         # --hidden_dim
    dropout: 0.1            # --dropout
    nheads: 8               # --nheads
    num_queries: 100        # --num_queries
    pre_norm: false         # --pre_norm
    backbone:
      _target_: act.detr.models.backbone_getter.get_spUnet
      hidden_dim: ${policy.params.hidden_dim}  # --hidden_dim
      backbone:
        _target_: roboverse_learn.algorithms.diffusion_policy.diffusion_policy.model.vision.model_getter.get_spUnet
        in_channels: 6
        num_classes: 0
        pretrained_path: null


policy_runner:
  action:
    action_type: "joint_pos"
    delta: 0
    action_dim: ${dataset.state_dim}
    action_chunk_steps: ${policy.params.num_queries}
  obs:
    obs_type: "joint_pos"
    obs_dim: ${dataset.state_dim}
    obs_padding: 0


logging:
  project: RoboVerse_ACT
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${encoder_name}_${task_name}
  tags: ${now:%Y.%m.%d-%H.%M.%S}_${encoder_name}_${task_name}
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False
  save_root_dir: info/outputs/ACT/${now:%Y.%m.%d}/${now:%H.%M.%S}_${encoder_name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: info/outputs/ACT/${now:%Y.%m.%d}/${now:%H.%M.%S}_${encoder_name}_${task_name}
  sweep:
    dir: info/outputs/ACT/${now:%Y.%m.%d}/${now:%H.%M.%S}_${encoder_name}_${task_name}
    subdir: ${hydra.job.num}
